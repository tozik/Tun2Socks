name: Release OBFS

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'     
        required: true
        type: string
      tag:
        description: 'Git Tag to checkout (use "latest" for latest release or leave empty)'
        required: false
        default: 'latest'
        type: string
      branch:
        description: 'Source branch to build from'
        required: false
        default: 'ofuscating'
        type: choice
        options:
          - main
          - master
          - ofuscating
          - develop

jobs:
  release:
    runs-on: macOS-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      
      - name: Get latest hev-socks5-tunnel release
        id: get_latest_release
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ "$TAG" == "latest" ] || [ -z "$TAG" ]; then
            LATEST_TAG=$(curl -s https://api.github.com/repos/heiher/hev-socks5-tunnel/releases/latest | jq -r .tag_name)
            echo "Using latest release: $LATEST_TAG"
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          else
            echo "Using specified tag: $TAG"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi
      
      - uses: actions/checkout@v4
        with:
          repository: 'heiher/hev-socks5-tunnel'
          submodules: 'true'
          path: 'temp'
          ref: ${{ steps.get_latest_release.outputs.tag }}
      - uses: actions/checkout@v4
        with:
          repository: 'tozik/hev-socks5-tunnel-iphonesimulator-new'
          path: 'fake'
          
      - name: build macos arm64_x86_64
        run: |
          mkdir macos_arm64_x86_64
          mkdir macos_arm64_x86_64/macos_arm64
          mkdir macos_arm64_x86_64/macos_x86_64
          cd temp
          make clean
          make PP=g++ \
               CC=gcc \
               CFLAGS="-arch x86_64 -mmacosx-version-min=12.0" \
               LFLAGS="-arch x86_64 -mmacosx-version-min=12.0" static
          libtool -static -o ../macos_arm64_x86_64/macos_x86_64/libhev-socks5-tunnel.a \
                  bin/libhev-socks5-tunnel.a \
                  third-part/lwip/bin/liblwip.a \
                  third-part/yaml/bin/libyaml.a \
                  third-part/hev-task-system/bin/libhev-task-system.a
          make clean
          make PP=g++ \
               CC=gcc \
               CFLAGS="-arch arm64 -mmacosx-version-min=12.0" \
               LFLAGS="-arch arm64 -mmacosx-version-min=12.0" static
          libtool -static -o ../macos_arm64_x86_64/macos_arm64/libhev-socks5-tunnel.a \
                  bin/libhev-socks5-tunnel.a \
                  third-part/lwip/bin/liblwip.a \
                  third-part/yaml/bin/libyaml.a \
                  third-part/hev-task-system/bin/libhev-task-system.a
          cd ../macos_arm64_x86_64
          lipo -create -o ./libhev-socks5-tunnel.a ./macos_arm64/libhev-socks5-tunnel.a ./macos_x86_64/libhev-socks5-tunnel.a

          
      - name: build iphoneos arm64
        run: |
          mkdir iphoneos_arm64
          cd temp
          make clean
          make PP="xcrun --sdk iphoneos --toolchain iphoneos clang" \
               CC="xcrun --sdk iphoneos --toolchain iphoneos clang" \
               CFLAGS="-arch arm64 -mios-version-min=12.0" \
               LFLAGS="-arch arm64 -mios-version-min=12.0" static
          libtool -static -o ../iphoneos_arm64/libhev-socks5-tunnel.a \
                  bin/libhev-socks5-tunnel.a \
                  third-part/lwip/bin/liblwip.a \
                  third-part/yaml/bin/libyaml.a \
                  third-part/hev-task-system/bin/libhev-task-system.a
          make clean
          
      - name: build iphonesimulator arm64_x86_64
        run: |
          mkdir iphonesimulator_arm64_x86_64
          mkdir iphonesimulator_arm64_x86_64/iphonesimulator_arm64
          mkdir iphonesimulator_arm64_x86_64/iphonesimulator_x86_64
          cd fake
          make clean
          make PP="xcrun -sdk iphonesimulator clang" \
               CC="xcrun -sdk iphonesimulator clang" \
               CFLAGS="-arch arm64 -mios-simulator-version-min=12.0" \
               LFLAGS="-arch arm64 -mios-simulator-version-min=12.0" static
          cp bin/libhev-socks5-tunnel.a ../iphonesimulator_arm64_x86_64/iphonesimulator_arm64/libhev-socks5-tunnel.a
          make clean
          make PP="xcrun -sdk iphonesimulator clang" \
               CC="xcrun -sdk iphonesimulator clang" \
               CFLAGS="-arch x86_64 -mios-simulator-version-min=12.0" \
               LFLAGS="-arch x86_64 -mios-simulator-version-min=12.0" static
          cp bin/libhev-socks5-tunnel.a ../iphonesimulator_arm64_x86_64/iphonesimulator_x86_64/libhev-socks5-tunnel.a
          make clean
          cd ../iphonesimulator_arm64_x86_64
          lipo -create -o ./libhev-socks5-tunnel.a ./iphonesimulator_arm64/libhev-socks5-tunnel.a ./iphonesimulator_x86_64/libhev-socks5-tunnel.a
          
      - name: Build xcframework
        run: |
          mkdir include
          cp temp/src/hev-main.h include/vpns-traffic-manager.h
          cp ./Templates/VPNSTrafficManager.template include/module.modulemap
          xcodebuild -create-xcframework \
                     -library ./iphoneos_arm64/libhev-socks5-tunnel.a \
                     -headers ./include \
                     -library ./iphonesimulator_arm64_x86_64/libhev-socks5-tunnel.a \
                     -headers ./include \
                     -library ./macos_arm64_x86_64/libhev-socks5-tunnel.a \
                     -headers ./include \
                     -output ./VPNSTrafficManager.xcframework
          zip -r VPNSTrafficManager.xcframework.zip VPNSTrafficManager.xcframework
      
      - name: Update package file
        run: |
          export CHECKSUM=$(shasum -a 256 ./VPNSTrafficManager.xcframework.zip | awk '{print $1}')
          echo "Computed SHA256 checksum: $CHECKSUM"
          echo "Building from branch: ${{ github.event.inputs.branch }}"
          echo "// swift-tools-version: 5.7" > Package.swift
          echo "" >> Package.swift
          echo "import PackageDescription" >> Package.swift
          echo "" >> Package.swift
          echo "let package = Package(" >> Package.swift
          echo "  name: \"VPNSTrafficManager\"," >> Package.swift
          echo "  platforms: [.iOS(.v15), .macOS(.v13)]," >> Package.swift
          echo "  products: [" >> Package.swift
          echo "    .library(name: \"VPNSTrafficManager\", targets: [\"VPNSTrafficManager\"])," >> Package.swift
          echo "    .library(name: \"VPNSTrafficManagerCode\", targets: [\"VPNSTrafficManagerCode\"])" >> Package.swift
          echo "  ]," >> Package.swift
          echo "  targets: [" >> Package.swift
          echo "    .target(" >> Package.swift
          echo "      name: \"VPNSTrafficManager\"," >> Package.swift
          echo "      dependencies: [\"HevSocks5Tunnel\", \"VPNSTrafficManagerCode\"]" >> Package.swift
          echo "    )," >> Package.swift
          echo "    .target(" >> Package.swift
          echo "      name: \"VPNSTrafficManagerCode\"," >> Package.swift
          echo "      publicHeadersPath: \".\"" >> Package.swift
          echo "    )," >> Package.swift
          echo "    .binaryTarget(" >> Package.swift
          echo "      name: \"HevSocks5Tunnel\"," >> Package.swift
          echo "      url: \"https://github.com/tozik/Tun2Socks/releases/download/${{ github.event.inputs.version }}/VPNSTrafficManager.xcframework.zip\"," >> Package.swift
          echo "      checksum: \"$CHECKSUM\"" >> Package.swift
          echo "    )" >> Package.swift
          echo "  ]" >> Package.swift
          echo ")" >> Package.swift
                
      # Пушим артефакт и Package.swift
      - name: Commit Package.swift
        run: |
          # Выводим список файлов в текущем каталоге и проверяем артефакт
          ls -l ./VPNSTrafficManager.xcframework.zip
          shasum -a 256 ./VPNSTrafficManager.xcframework.zip
          
          # Настраиваем git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Добавляем только Package.swift в git
          git add Package.swift
          
          # Выполняем commit с информацией о версии и ветке
          git commit -m "Update Package.swift for version ${{ github.event.inputs.version }} from branch ${{ github.event.inputs.branch }}"
          
          # Пушим изменения в выбранную ветку
          git push origin ${{ github.event.inputs.branch }}
          
          # Создаем новый тег для релиза
          git tag -f ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }} --force
      
      # Создаем релиз и загружаем артефакт в секцию "Releases" GitHub
      - name: Upload release asset to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          tag_name: ${{ github.event.inputs.version }}
          body: |
            Release built from source tag: ${{ steps.get_latest_release.outputs.tag }}
            Source branch: ${{ github.event.inputs.branch }}
            
            ## Changes in this release:
            - Built with VPNSTrafficManager framework
            - Source code obfuscated for enhanced security
            - Based on hev-socks5-tunnel ${{ steps.get_latest_release.outputs.tag }}
            
            ## Installation:
            Add this package to your project using Swift Package Manager:
            ```
            https://github.com/tozik/Tun2Socks
            ```
          files: ./VPNSTrafficManager.xcframework.zip
          token: ${{ secrets.GITHUB_TOKEN }}
